# Install as /etc/nginx/sites-available/farmer-chat and enable it.
# Keep the existing TLS certificate paths used by the deployment.
server {
    listen 443 ssl;
    server_name 13.201.189.130;
    root /var/www/farmer-web;

    ssl_certificate /home/ubuntu/onboarding-weather/cert.pem;
    ssl_certificate_key /home/ubuntu/onboarding-weather/key.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /weather-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /onboarding-api/ {
        proxy_pass https://127.0.0.1:8004/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name 13.201.189.130;
    return 301 https://$host$request_uri;
}
