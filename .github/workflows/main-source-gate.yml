name: Main Source Gate

# Repo workflow rule: main only ever receives merges from dev (feature
# branches merge into dev first). This is the enforcement mechanism --
# GitHub branch protection has no native "only accept PRs from branch X"
# rule, so this job fails any PR into main whose source isn't dev, and is
# registered as a required status check on main's branch protection.
on:
  pull_request:
    branches: [main]

jobs:
  require-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require PR source branch to be dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests into main are only allowed from 'dev' (this PR is from '${{ github.head_ref }}'). Merge into dev first, then open dev -> main."
            exit 1
          fi
          echo "Source branch is dev -- OK"
