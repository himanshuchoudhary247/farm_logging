name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (from lockfile)
        run: pip install -r requirements.lock.txt

      - name: Check lockfile matches requirements.txt
        # Installs requirements.txt in a fresh venv with the lockfile as
        # constraints, then checks every installed package is pinned in the
        # lockfile at that version. Fails when requirements.txt needs
        # something the lockfile does not pin (a new or bumped dependency);
        # a new upstream release alone never fails it.
        run: |
          python -m venv /tmp/lockcheck-venv
          /tmp/lockcheck-venv/bin/pip install -q -r requirements.txt -c requirements.lock.txt || {
            echo "::error::requirements.txt cannot be installed with the versions pinned in requirements.lock.txt. Regenerate the lockfile (see docs/06-configuration-reference.md) and commit it."
            exit 1
          }
          /tmp/lockcheck-venv/bin/pip freeze > /tmp/fresh.lock
          python scripts/check_lockfile.py requirements.lock.txt /tmp/fresh.lock

      - name: Run tests
        run: python -m pytest tests/ -q
