# FarmHerd multi-turn conversation test set.
# Replays real-shape dialogs where the user answers follow-up questions.
# Harness: scripts/eval_conversations.py
#
# Per turn:
#   user: raw text sent to process_text_input()
#   expect: subset of session.entities that must be present after this turn
#          (also may assert intent). Only present keys are checked.
# Final block:
#   entities: full expected accumulated state
#   intent:   final intent
#   complete: (optional) True/False
#
# LLM is stubbed to empty (offline). Every match therefore proves rule
# extractors + session merge behavior work end-to-end; live Bedrock adds
# only best-effort enrichment on top and cannot regress correctness.

# =============================================================================
# KANNADA — appointment booking flows
# =============================================================================
- id: kn-conv-01-booking-cow-fever
  lang: kn-IN
  turns:
    - user: "ನನಗೆ ಅಪಾಯಿಂಟ್ಮೆಂಟ್ ಬೇಕು"
      expect: {intent: CREATE_APPOINTMENT}
    - user: "ನನ್ನ ಹಸು"
      expect: {species: cow}
    - user: "ಜ್ವರ"
      expect: {issue: fever}
    - user: "ನಾಳೆ ಬೆಳಗ್ಗೆ"
      expect: {date: tomorrow, time: "09:00"}
    - user: "ಹೌದು"
      expect: {}
  final:
    intent: CREATE_APPOINTMENT
    entities: {species: cow, issue: fever, date: tomorrow, time: "09:00"}

- id: kn-conv-02-booking-goat-not-eating
  lang: kn-IN
  turns:
    - user: "ಪಶು ವೈದ್ಯರನ್ನು ಕರೆಸಬೇಕು"
      expect: {intent: CREATE_APPOINTMENT}
    - user: "ಆಡು"
      expect: {species: goat}
    - user: "ತಿನ್ನುತ್ತಿಲ್ಲ"
      expect: {symptoms: ["not eating"]}
    - user: "ಇಂದು ಸಂಜೆ ಆರು ಗಂಟೆ"
      expect: {date: today, time: "18:00"}
  final:
    intent: CREATE_APPOINTMENT
    entities: {species: goat, date: today, time: "18:00"}

- id: kn-conv-03-vaccine-sheep
  lang: kn-IN
  turns:
    - user: "ಕುರಿಗೆ ಲಸಿಕೆ ಬೇಕು"
      expect: {intent: CREATE_APPOINTMENT, species: sheep}
    - user: "ನಾಳೆ"
      expect: {date: tomorrow}
    - user: "ಹತ್ತು ಗಂಟೆಗೆ"
      expect: {time: "10:00"}
  final:
    intent: CREATE_APPOINTMENT
    entities: {species: sheep, date: tomorrow, time: "10:00"}

- id: kn-conv-04-log-health-buffalo
  lang: kn-IN
  turns:
    - user: "ನಮ್ಮ ಎಮ್ಮೆ ಹಾಲು ಕೊಡುತ್ತಿಲ್ಲ"
      expect: {species: buffalo}
    - user: "ಎರಡು ದಿನದಿಂದ"
      expect: {}
    - user: "ಜ್ವರ ಇದೆ"
      expect: {issue: fever}
  final:
    entities: {species: buffalo, issue: fever}

- id: kn-conv-05-weather
  lang: kn-IN
  turns:
    - user: "ಹವಾಮಾನ ಹೇಗಿದೆ"
      expect: {intent: WEATHER_ALERT}
    - user: "583101"
      expect: {}
  final:
    intent: WEATHER_ALERT

