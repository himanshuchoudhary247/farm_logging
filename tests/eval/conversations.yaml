# =============================================================================
# ENGLISH — reference flows (should match ~100% on rule path)
# =============================================================================
- id: en-conv-01-booking-cow-fever
  lang: en-IN
  turns:
    - user: "I want to book an appointment"
      expect: {intent: CREATE_APPOINTMENT}
    - user: "my cow"
      expect: {species: cow}
    - user: "fever"
      expect: {issue: fever}
    - user: "tomorrow morning"
      expect: {date: tomorrow}
    - user: "10 am"
      expect: {time: "10:00"}
    - user: "yes"
      expect: {}
  final:
    intent: CREATE_APPOINTMENT
    entities: {species: cow, issue: fever, date: tomorrow, time: "10:00"}

- id: en-conv-02-log-health-goat
  lang: en-IN
  turns:
    - user: "my goat is sick"
      expect: {intent: LOG_HEALTH, species: goat}
    - user: "not eating"
      expect: {symptoms: ["not eating"]}
    - user: "since yesterday"
      expect: {}
  final:
    intent: LOG_HEALTH
    entities: {species: goat}

- id: en-conv-03-weather
  lang: en-IN
  turns:
    - user: "give me weather alert"
      expect: {intent: WEATHER_ALERT}
    - user: "for 583101"
      expect: {weather_location: "583101"}
  final:
    intent: WEATHER_ALERT
    entities: {weather_location: "583101"}

- id: en-conv-04-fetch-animal
  lang: en-IN
  turns:
    - user: "show details of my goat"
      expect: {intent: FETCH_ANIMAL_DETAILS, species: goat}
    - user: "tag 1234"
      expect: {animal_tag: "1234"}
  final:
    intent: FETCH_ANIMAL_DETAILS
    entities: {species: goat}

- id: en-conv-05-appointment-quick
  lang: en-IN
  turns:
