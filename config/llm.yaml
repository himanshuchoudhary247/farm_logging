# FarmHerd LLM routing.
# Per-task tiering: extraction is hot-path (every voice turn), generation is
# per-response text, long_form is for seasonal / multi-paragraph advisory.
# Any hardcoded model id in code should read from here via
# services.llm_service.bedrock_adapter.model_for_task().
#
# Override in prod via env:
#   BEDROCK_MODEL_EXTRACTION, BEDROCK_MODEL_GENERATION, BEDROCK_MODEL_LONG_FORM
#   BEDROCK_MODEL_EXTRACTION_ALT (Nova Micro toggle for A/B eval)
region: ap-south-1
provider: bedrock

models:
  extraction:
    id: deepseek.v3-v1:0
    max_tokens: 256
    temperature: 0
    # Winner of the 10-model x 60-conversation x 6-language live eval,
    # 2026-09-11: 100% turn-pass / 100% conversation-pass, 0 remaining
    # failures after the schema + prompt fixes below. See
    # docs/model-evaluation-2026-09-11.md for full methodology and results.
    # Haiku 4.5 was the original pick but is blocked on this AWS account by
    # ResourceNotFoundException: "Model use case details have not been
    # submitted for this account" (Anthropic use-case form, not a code
    # issue) — retry that once the form clears.

  extraction_alt:
    id: mistral.ministral-3-14b-instruct
    max_tokens: 256
    temperature: 0
    # A/B / cost-sensitive candidate: 92.5% turn-pass at 4x lower cost and
    # ~40% lower P95 latency than DeepSeek V3. Flip via
    # BEDROCK_MODEL_EXTRACTION=mistral.ministral-3-14b-instruct for canary.
    # Weak spot: goat/sheep confusion on Kannada ಆಡು/Tamil ஆடு specifically —
    # see the eval doc before promoting to default.

  generation:
    id: deepseek.v3-v1:0
    max_tokens: 512
    temperature: 0.2
    # Was global.anthropic.claude-haiku-4-5-20251001-v1:0 — confirmed still
    # blocked live 2026-09-16 (ResourceNotFoundException: Anthropic use-case
    # form not submitted on this account). The comment here previously said
    # this tier "falls back to Haiku until granted" but it was pointed
    # straight at the blocked model with no actual fallback — every
    # TaskTier.GENERATION caller (translate_to_english,
    # generate_health_recommendation) was silently failing. Switched to
    # DeepSeek V3 (same proven model as extraction/long_form) as the working
    # default. in.openai.gpt-5.6-luna also still blocked
    # (AccessDeniedException, needs a model access request) — same story.
    # Revisit both once their account access clears.

  long_form:
    id: deepseek.v3-v1:0
    max_tokens: 1024
    temperature: 0.3
    # Seasonal + personalized advisory. Native ap-south-1. Corrected from
    # deepseek.deepseek-v3-1-v1:0 (invalid id on this account) 2026-09-11 —
    # verified working id is deepseek.v3-v1:0.

# Legacy: preserved for callers still reading text/voice.model. New code
# should call model_for_task() instead.
text:
  provider: bedrock
  model: global.anthropic.claude-haiku-4-5-20251001-v1:0
  region: ap-south-1
voice:
  provider: bedrock
  model: global.anthropic.claude-haiku-4-5-20251001-v1:0
  region: ap-south-1

# STT/TTS provider selection (voice pipeline, separate from the text models
# above). Read via services.llm_service.bedrock_adapter.get_stt_provider() /
# get_tts_provider(). Env overrides: STT_PROVIDER, TTS_PROVIDER.
stt:
  provider: aws-transcribe-streaming
  # Options: aws-transcribe-streaming (default since 2026-09-16 — verified
  # live across all 6 languages: 1.0-3.1s vs 8-12s for batch, ~6-8x faster,
  # transcripts correct in every language tested) | aws-transcribe (batch,
  # previous default — job-submit-then-poll design, dominated voice-turn
  # latency) | nova-sonic (see below — NOT wired into transcribe.py yet).

tts:
  provider: aws-polly
  # Options: aws-polly (current default) | nova-sonic (NOT wired into tts.py
  # yet — see nova_sonic block below for why).
  #
  # polly_languages: languages Polly actually has real voice support for in
  # this app. Any language NOT in this list routes straight to
  # fallback_provider — this is a capability table, not a per-language
  # special case in code. Verified live 2026-09-16: Polly has no Kannada/
  # Tamil/Telugu/Malayalam voices. Forcing that text through a Hindi/English
  # voice doesn't transliterate it — produces near-silent audio (514 bytes
  # for a full sentence via Aditi+hi-IN) or gibberish (Raveena+en-IN reading
  # native script as English phonemes). No SSML/voice trick fixes a voice
  # that was never trained on the language.
  polly_languages: [en, hi]
  # fallback_provider: for any language not in polly_languages, or if Polly
  # itself errors (ThrottlingException etc). gtts (Google Translate's TTS,
  # unofficial/free, not paid/SLA'd — real reliability/ToS tradeoff vs
  # Polly) is validated: ~500-900ms, real full-length audio for kn/ta/te/ml,
  # already proven intelligible all session as the input-audio generator for
  # every non-English Nova Sonic test (Bedrock's ASR correctly transcribed
  # its output multiple times).
  fallback_provider: gtts
  # Env overrides: TTS_POLLY_LANGUAGES (comma list), TTS_FALLBACK_PROVIDER

# Amazon Nova Sonic (speech-to-speech). Verified live 2026-09-13:
#   - Access: CONFIRMED. Real InvokeModelWithBidirectionalStream calls
#     succeed and bill usage tokens on this account, in us-east-1 and
#     ap-northeast-1 only. NOT available in ap-south-1 (where FarmHerd is
#     hosted) or ap-southeast-1/2. ap-south-2 check errored
#     (UnrecognizedClientException / InvalidClientTokenId) — that region is
#     simply not enabled on this account, unrelated to Sonic access.
#   - Language coverage, tested with real audio turns (gTTS-synthesized,
#     English/Hindi/Kannada/Tamil/Telugu/Malayalam prompts):
#       en: correct ASR + relevant conversational replies.
#       hi: correct ASR, but replies sometimes came back in English instead
#           of Hindi — language-fidelity is not reliable without an explicit
#           "always reply in the input language" system instruction (untested
#           whether that instruction fixes it).
#       kn/ta/te/ml: ASR degraded to phonetic garbage or bare transcript
#           echo with no generated reply at all. Not usable.
#   - Reliability: one English turn out of ~5 produced an empty response
#     with no error — server-side turn-taking (VAD) on synthetic audio is
#     not 100% consistent.
#   - Architecture blocker (resolved 2026-09-13): the only Nova Sonic SDK
#     (aws_sdk_bedrock_runtime, for the bidirectional-stream API — plain
#     boto3 does not support it) requires Python >=3.12. App venv bumped
#     3.9 -> 3.13 for this. Still not wired into transcribe.py/tts.py as a
#     real backend — the language-coverage gap above is the blocker now,
#     not the runtime.
#   - Even after a runtime upgrade, Sonic would only be a viable *drop-in*
#     STT/TTS backend for en/hi traffic — kn/ta/te/ml would still need the
#     existing Transcribe+Bedrock+Polly path, so it'd be an additional
#     per-language branch, not a wholesale replacement.
nova_sonic:
  model_id: amazon.nova-sonic-v1:0
  region: us-east-1
  voice_id: matthew
  allowed_languages: [en, hi]
  # Env overrides: NOVA_SONIC_MODEL_ID, NOVA_SONIC_REGION, NOVA_SONIC_VOICE_ID
